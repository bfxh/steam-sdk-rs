name: Release

# 打 tag（v大.小.补丁）即出发布物：两个 crate 的 .crate 包 + rustdoc 站点。
# **不发 crates.io**：`steamworks` 这个名字的所有权在原作者手里，本仓只出
# GitHub Release 附件，发布到 registry 只能是维护者自己的决定。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      # 只为把"tag 专用"的两步校验在**不打 tag、不建 Release** 的前提下跑一遍：
      # 这两步是发布正确性的门，不能等到真发版才第一次执行。留空则跳过。
      simulate_tag:
        description: 填 v大.小.补丁 以演练 tag 校验（不会创建 Release）
        required: false
        type: string
        default: ""

permissions:
  contents: write

# 同一个 ref 上只留最新一次发布构建；旧的排队任务直接取消，避免两次构建抢着
# 建同一个 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 先验"这个 tag 说的东西和树里的一致"，再花时间做发布物。
  # 没有这一步，完全可能发出一个标签写 0.14.0、Cargo.toml 还是 0.13.1、
  # CHANGELOG 里根本没有对应条目的包。
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libudev-dev libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Tag must match the crate version
        # 真实 tag 时必查；`simulate_tag` 让这一步能在不打 tag 的情况下被演练。
        # tag 值经 env 传入，不拼进 shell。
        if: github.ref_type == 'tag' || inputs.simulate_tag != ''
        env:
          CHECK_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.simulate_tag }}
        run: |
          set -euo pipefail
          declared=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          tag="${CHECK_TAG#v}"
          echo "Cargo.toml version = $declared, tag = $tag"
          if [ "$declared" != "$tag" ]; then
            echo "::error::tag $CHECK_TAG does not match Cargo.toml version $declared"
            exit 1
          fi
          sys_declared=$(sed -n 's/^version = "\([^"]*\)"/\1/p' steamworks-sys/Cargo.toml | head -1)
          sys_required=$(sed -n 's/^steamworks-sys = .*version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          echo "steamworks-sys version = $sys_declared, required by root = $sys_required"
          case "$sys_declared" in
            "$sys_required"*) ;;
            *) echo "::error::steamworks-sys is $sys_declared but root requires $sys_required" && exit 1 ;;
          esac

      - name: CHANGELOG must carry this version
        if: github.ref_type == 'tag' || inputs.simulate_tag != ''
        run: |
          set -euo pipefail
          declared=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if grep -q "^## \[$declared\]" CHANGELOG.md; then
            echo "CHANGELOG has a section for $declared"
          else
            echo "::error::CHANGELOG.md has no '## [$declared]' section -- move Unreleased into a dated entry before releasing"
            exit 1
          fi

      - name: Tests and docs must be clean first
        run: |
          cargo test --locked --all-features --lib
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features --document-private-items

  artifacts:
    name: Build release artifacts
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libudev-dev libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: Swatinem/rust-cache@v2

      # --locked：发布物必须和 CI 校验过的那张依赖图是同一张。
      - name: Build
        run: cargo build --release --locked --all-features

      - name: Package crates
        run: |
          # --no-verify 跳过重新构建与编译期校验；本仓由 quality CI 负责编译正确性，
          # 这里只要产物（.crate）本身完整、清单干净。
          cargo package --list -p steamworks
          cargo package --list -p steamworks-sys
          cargo package --no-verify --allow-dirty -p steamworks
          cargo package --no-verify --allow-dirty -p steamworks-sys

      - name: Build rustdoc
        run: cargo doc --no-deps --all-features --document-private-items

      - name: Bundle rustdoc
        run: tar -czf steamworks-doc.tar.gz -C target/doc .

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            target/package/steamworks-*.crate
            target/package/steamworks-sys-*.crate
            steamworks-doc.tar.gz

      - if: github.ref_type == 'tag'
        name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/package/steamworks-*.crate \
            target/package/steamworks-sys-*.crate \
            steamworks-doc.tar.gz \
            --title "steamworks $GITHUB_REF_NAME" \
            --generate-notes
