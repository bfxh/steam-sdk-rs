name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# 同一条线上只跑最新一次：连推时，被后续提交取代的排队任务直接取消，快速反馈。
# 唯一不在这条规则里的作业是 advisory 三件套（udeps / geiger / audit），它已拆到
# `quality-extra.yml` 并关掉 cancel-in-progress：实测它被自己的后续推送杀掉过三次
# （5m14s / 7m46s / 10m17s，均远低于 30 分钟超时），十几分钟的判定从来跑不到结论。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 质量门禁：fmt / clippy / check / doc / test
  # 成功即绿。clippy 关闭 -D warnings，等 CI 实测确认没有新增真实问题再收紧。
  #
  # `image` 特征的传递依赖（moxcms / pxfm）要求比 1.80.0 更新的 cargo，
  # 连 manifest 都解析不了，所以 MSRV 作业只校验默认特征集；
  # --all-features 由 stable 作业覆盖。
  #
  # 所有构建步骤都带 --locked：Cargo.lock 已入库，任何依赖版本漂移
  # （包括悄悄换一个不兼容 MSRV 的小版本）都会在这里判红，而不是
  # 等到下一次有人重新解析时才在某个平台上炸开。
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        toolchain: [stable, "1.80.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FEATURES: ${{ matrix.toolchain == 'stable' && '--all-features' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libudev-dev libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libxcb-shape0-dev libxcb-xfixes0-dev
        if: runner.os == 'linux'

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ steps.toolchain.outputs.cachekey }}

      # 以前这一步在 Windows 上是跳过的：本机 core.autocrlf=true 会把签出的
      # .rs 变成 CRLF，rustfmt 于是报出满屏假差异。.gitattributes 已把自己写的
      # 源码钉成 eol=lf（Valve 的 46 个 SDK 头文件保持 -text 原样），所以现在
      # 三个平台都能跑同一条检查。
      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (no -D warnings)
        run: cargo clippy --locked --all-targets $EXAMPLES $FEATURES --message-format short

      - name: check (all targets)
        run: cargo check --locked --all-targets $EXAMPLES $FEATURES

      - name: doc
        # 文档链接必须是干净的：本机实测 `RUSTDOCFLAGS=-D warnings cargo doc`
        # 在默认与 --all-features 两种特征集下都通过后，才在这里收紧。
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps $FEATURES --document-private-items

      - name: test (lib)
        run: cargo test --locked --lib $FEATURES

      - name: test (doc)
        if: matrix.toolchain == 'stable'
        run: cargo test --locked --doc $FEATURES

      # MSRV 只能有一处权威声明：Cargo.toml、steamworks-sys/Cargo.toml 与本作业跑的
      # 版本必须一致，否则叫 "1.80.0" 的作业在测别的东西，用户按声明装依赖时才会发现。
      - name: MSRV has a single source
        if: matrix.toolchain == '1.80.0'
        run: bash scripts/ci/msrv_single_source.sh "1.80.0"

      # 两个"上帝模块"尺：单文件行数与单类型公开方法数。
      # 基线就是实测当下值（2026-10-14 复算），**双向**判红：
      # 长大一寸即红；缩小也红，逼着把基线改成真数——
      # 留一条比现实宽的基线，下一批就会按那条宽线继续堆。
      - name: module sizes stay under their registered ceilings
        run: |
          python3 scripts/ci/module_sizes.py src > "$RUNNER_TEMP/sizes.txt"
          python3 scripts/ci/compare_baseline.py scripts/ci/baselines/module_sizes.txt "$RUNNER_TEMP/sizes.txt"

      - name: no type grows into a god object
        run: |
          python3 scripts/ci/type_surface.py src > "$RUNNER_TEMP/types.txt"
          python3 scripts/ci/compare_baseline.py scripts/ci/baselines/type_surface.txt "$RUNNER_TEMP/types.txt"

      # 接口覆盖台账：33 个接口各自 declared / called 两个数，双向判红。
      # 文档里那张覆盖率表现在由这条门复算，不再靠人手抄（抄过一次就再也对不上）。
      # 掉一个 called 就是少包一个函数，必须写进提交信息才能重录；SDK 升级动了
      # declared 也同样要显式认。尺子自带地板：读不到绑定文件、解析出的接口数不够、
      # 或发现只有测试代码在调某函数，都算"没判定"（退出码 2）而不是 0 覆盖的假绿。
      - name: interface coverage stays at its registered ledger
        run: |
          python3 scripts/ci/api_coverage.py > "$RUNNER_TEMP/coverage.txt"
          python3 scripts/ci/compare_baseline.py scripts/ci/baselines/api_coverage.txt "$RUNNER_TEMP/coverage.txt"

      # `unreachable!()` 落在 `match` 的兜底臂里 = Steam 上游枚举多出一个值时，在本进程内 panic。
      # 台账按文件计数，双向判红：新增一处即红；修掉一处也要把基线改小才算数（方向是 0）。
      # 首跑实测 10 处；逐条修到 2026-10-15 的 **0 处**（`baselines/no_panic_sites.txt` 现为空）。
      # 空台账尤其危险，所以尺子自己打 `#scanned <文件数>`，比较器没有这条标记就判"没判定"（码 2）
      # 而不是绿——否则"尺子什么都没读到"和"确实一处都没有"长得一模一样。
      - name: panic sites on unnamed enum values stay counted
        run: |
          python3 scripts/ci/no_panic_on_unknown_enum.py src > "$RUNNER_TEMP/panic_sites.txt"
          python3 scripts/ci/compare_baseline.py scripts/ci/baselines/no_panic_sites.txt "$RUNNER_TEMP/panic_sites.txt"

      # 本仓的文档是**证据文件**：论断靠 `src/某.rs:行号` 支撑，读者据此复核。三次目录化拆分
      # （`src/friends.rs`、`src/ugc.rs` 变目录，`src/lib.rs` 瘦身）把这些指针冲掉了而没有任何
      # 一步变红——指针烂掉的文档读起来就像编的，这条门把它钉成判定。
      # 判据：路径必须仍被 git 跟踪；行号必须在文件行数之内、且不能落在空行（落在空行=行号已漂）。
      # 反证（2026-10-15 首跑逐条实测，全部判红）：① 改一个字节的路径名；② 把行号改到 EOF 之后；
      # ③ 把行号改到某个空行上；④ 删掉一条登记单里真被引用的条目；⑤ 往登记单塞一条没人引用的。
      # 历史证据指针（当日实测、文件后来没了）**不改写**——把测量值换成今天的坐标就是拿猜测替换
      # 测量；它们进 `baselines/doc_pointers_historical.txt` 登记单，这张单只能变短：
      # 引用没了还留着 = 判红。首跑实测 128 条指针 / 10 个文档，其中 19 条登记为历史。
      # 尺子自己也被反证修过一次：`src/...` 若不做行首边界，会把 `steamworks-sys/src/windows_bindings.rs`
      # 里的后缀也读成一个裸指针，于是 4 条本来正确的引用被当成死路径——解析层出错时，
      # "违规数=0"可能只是它在看别的东西。
      - name: documented source pointers resolve
        run: python3 scripts/ci/doc_pointers.py

      # `cargo test` 在"一个测试都没匹配到"时仍然退出 0 并打印 `test result: ok. 0 passed`。
      # 这条门读实际跑到的用例数，为 0 就判红，并拒绝低于登记地板的数量。
      - name: test floors (a run that tested nothing is not green)
        if: matrix.toolchain == 'stable'
        run: |
          bash scripts/ci/test_floor.sh lib
          bash scripts/ci/test_floor.sh doc

      # clippy 的 `correctness` / `suspicious` 两类按 clippy 自己的定义就是"大概是 bug"，
      # 不是风格偏好，所以这里零容忍：不带基线、不带百分比、不允许"以后再说"。
      # 2026-10-15 第一次跑就抓到 6 处，其中 `free_rust_message_buffer` 用
      # `Box::from_raw(*mut c_void)` 重建 `Box<[u8]>`：实测尺（E:/tmp/alloc_probe.rs）量出
      # alloc size=4096 / dealloc size=1 同一指针，即按错误布局释放。
      # 只在 stable 臂跑：MSRV 臂的 clippy 是 1.80 的旧 lint 集，两类会少判几条。
      # 门禁还自带三道地板：cargo 没跑起来 / 没编出两个 crate 的 artifact / JSON 解析不动，
      # 都算"没判定"（退出码 2）而不是绿；源码里每一处 `#[allow(clippy::…)]` 也进了台账，
      # 多一条即红——否则"这条门一条都没报"可能只是因为它被人静音了。
      - name: clippy correctness/suspicious (zero tolerance)
        if: matrix.toolchain == 'stable'
        run: python3 scripts/ci/clippy_gate.py

  # 示例与库本体分开编译，有两个实测原因：
  # 1. 示例是各自独立的 workspace 成员，不加 --workspace 就永远不会被编译，
  #    只能靠人手动跑才发现它们烂了；
  # 2. `--workspace` 与 `--all-features` 不能写在同一条命令里——实测本机
  #    `cargo clippy --workspace --all-features` 会连带打开 steamworks-sys 的
  #    `rebuild-bindings` 特征，触发 bindgen 并要求 libclang，直接编译失败
  #    （`Unable to find libclang`）。所以这里只用默认特征集。
  examples:
    name: examples (workspace members)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libudev-dev libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libxcb-shape0-dev libxcb-xfixes0-dev
        if: runner.os == 'linux'

      - uses: Swatinem/rust-cache@v2
        with:
          key: examples-${{ matrix.os }}

      # `stream_events.rs` 声明了 required-features = ["futures"]，不带该特征时
      # cargo 会静默跳过它——`--all-targets` 也不编。这里显式打开，用包名限定
      # 是为了让 --workspace 里不含该特征的成员（steamworks-sys）不报错。
      - run: cargo check --locked --workspace --all-targets --features steamworks/futures

  # 每个可选特征单独编得动。`--all-features` 会掩盖某个特征自己的 cfg 已经烂掉，
  # 而先撞上这个坑的是只开了 `serde`（或只开 `image`）的用户，不是我们。
  features:
    name: feature matrix (each feature alone)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libudev-dev libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: features-ubuntu

      - run: bash scripts/ci/feature_matrix.sh

      # required-features 的目标会被 cargo 静默跳过（--all-targets 也不编），
      # 所以"作业跑了"不等于"这个示例被编过"。这里两头都验：开了特征必须编到，
      # 不开特征必须编不到——后者同时是本门立论前提的自检。
      - name: compile coverage (no silently-skipped targets)
        run: python3 scripts/ci/compile_coverage.py

  # 随仓的 Valve SDK 文本文件（45 个头 + steam_api.json）被改动不会让任何测试变红：
  # 绑定是生成后入库的，头文件被动过只会在下次重生成时显形，而那等于悄悄换了
  # "这个 wrapper 是在封谁"。清单把改动/新增/删除都变成指名判红。
  # 发布物里到底有什么：仓库里有不该进 .crate 的东西（工作流、设计笔记、
  # 本机跑示例留下的 steam_appid.txt），也有绝不该少的东西（两份 LICENSE）。
  # 只有 `cargo package --list` 能回答"用户实际收到什么"，所以清单进门。
  # 门自己也要被查：这一步专管"workflow 引用的文件在不在仓里"（我这边真实栽过两次：
  # 基线被 .gitignore 的 *.txt 吞掉、以及拿未提交的树去 clone），
  # 加上 permissions 插值（历史上把非 dispatch 的跑整条打成零作业）与逃生口计数。
  workflows:
    name: workflow self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: referenced files, timeouts and permissions
        run: python3 scripts/ci/workflow_inputs.py

      - name: shell escape hatches may only shrink
        run: |
          set -uo pipefail
          python3 scripts/ci/shell_hatches.py > "$RUNNER_TEMP/hatches.txt"
          python3 scripts/ci/compare_baseline.py scripts/ci/baselines/shell_hatches.txt "$RUNNER_TEMP/hatches.txt"

      # 本仓的门**就是文件**。已经发生过两次：门随的基线被 `.gitignore` 的 `*.txt` 吞掉，于是
      # CI 判的是只存在于写它那台机器上的文件；以及账本合法变空（panic 位点到 0）后，
      # "0 处违规"和"测量根本没落地"看起来一模一样。这条门逐个查：被跟踪、非空（除非显式
      # 豁免并写明理由）、且有一个真的提到它的读者；豁免理由配上一个已经非空的账本 = 判红。
      # 实测：10 个账本、1 条豁免、10 条读者声明；首版夹具差点自己骗过它——我是往 READERS
      # *追加*而不是*替换*，于是真仓的 10 条账本全被判成"已不存在"，那条红什么也没证明。
      - name: ledgers are tracked, populated and read
        run: python3 scripts/ci/baseline_files.py

      # 每道门都要能判红，否则它就只是一行日志。这条步在临时目录里给每把尺子造一份**必然违规**
      # 的夹具，断言它报红/报"没判定"；真实工作树完全不碰。
      # 它的由来是一条实测教训，不是洁癖：文档指针尺把 4 条**本来正确**的引用判成死路径，
      # 因为它在更长的正确路径里匹配到了后缀——那种错只会表现为"门有发现"，永远不会表现为"门坏了"。
      # 现有覆盖（实测 29 条断言全过）：compare_baseline 的双向判定与 `#scanned` 标记规则、
      # panic 尺端到端判红 + 扫描数地板、doc_pointers 的 4 类违规与空扫描地板、
      # baseline_files 的 5 类违规与地板、api_coverage 喂错输入必须退出 2 而不是报 0 覆盖。
      # 未覆盖项写在脚本自己的 docstring 里（clippy_gate / test_floor / workflow_inputs /
      # package_inventory / sdk_vendored 需要真构建或整仓夹具），登记为不覆盖，不假装全绿。
      - name: every gate can still judge red
        run: python3 scripts/ci/canaries.py

  packaging:
    name: packaging inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libudev-dev libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: package inventory matches what was reviewed
        run: |
          set -uo pipefail
          python3 scripts/ci/package_inventory.py > "$RUNNER_TEMP/inventory.txt"
          python3 scripts/ci/compare_paths.py scripts/ci/baselines/package_inventory.txt "$RUNNER_TEMP/inventory.txt"

  vendored:
    name: vendored SDK manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: vendored files match the manifest
        run: |
          set -uo pipefail
          python3 scripts/ci/sdk_vendored.py > "$RUNNER_TEMP/vendored.txt"
          python3 scripts/ci/compare_hashes.py scripts/ci/baselines/sdk_vendored.txt "$RUNNER_TEMP/vendored.txt"
