name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# 同一条线上只跑最新一次：连推几个提交时，被后续提交取代的排队任务直接取消，
# 否则 `quality-extra`（要从源码编三个工具，十几分钟）会把 runner 排满。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 质量门禁：fmt / clippy / check / doc / test
  # 成功即绿。clippy 关闭 -D warnings，等 CI 实测确认没有新增真实问题再收紧。
  #
  # `image` 特征的传递依赖（moxcms / pxfm）要求比 1.80.0 更新的 cargo，
  # 连 manifest 都解析不了，所以 MSRV 作业只校验默认特征集；
  # --all-features 由 stable 作业覆盖。
  #
  # 所有构建步骤都带 --locked：Cargo.lock 已入库，任何依赖版本漂移
  # （包括悄悄换一个不兼容 MSRV 的小版本）都会在这里判红，而不是
  # 等到下一次有人重新解析时才在某个平台上炸开。
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        toolchain: [stable, "1.80.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FEATURES: ${{ matrix.toolchain == 'stable' && '--all-features' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libudev-dev libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libxcb-shape0-dev libxcb-xfixes0-dev
        if: runner.os == 'linux'

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ steps.toolchain.outputs.cachekey }}

      # 以前这一步在 Windows 上是跳过的：本机 core.autocrlf=true 会把签出的
      # .rs 变成 CRLF，rustfmt 于是报出满屏假差异。.gitattributes 已把自己写的
      # 源码钉成 eol=lf（Valve 的 46 个 SDK 头文件保持 -text 原样），所以现在
      # 三个平台都能跑同一条检查。
      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (no -D warnings)
        run: cargo clippy --locked --all-targets $EXAMPLES $FEATURES --message-format short

      - name: check (all targets)
        run: cargo check --locked --all-targets $EXAMPLES $FEATURES

      - name: doc
        # 文档链接必须是干净的：本机实测 `RUSTDOCFLAGS=-D warnings cargo doc`
        # 在默认与 --all-features 两种特征集下都通过后，才在这里收紧。
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps $FEATURES --document-private-items

      - name: test (lib)
        run: cargo test --locked --lib $FEATURES

      - name: test (doc)
        if: matrix.toolchain == 'stable'
        run: cargo test --locked --doc $FEATURES

  # 示例与库本体分开编译，有两个实测原因：
  # 1. 示例是各自独立的 workspace 成员，不加 --workspace 就永远不会被编译，
  #    只能靠人手动跑才发现它们烂了；
  # 2. `--workspace` 与 `--all-features` 不能写在同一条命令里——实测本机
  #    `cargo clippy --workspace --all-features` 会连带打开 steamworks-sys 的
  #    `rebuild-bindings` 特征，触发 bindgen 并要求 libclang，直接编译失败
  #    （`Unable to find libclang`）。所以这里只用默认特征集。
  examples:
    name: examples (workspace members)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libudev-dev libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libxcb-shape0-dev libxcb-xfixes0-dev
        if: runner.os == 'linux'

      - uses: Swatinem/rust-cache@v2
        with:
          key: examples-${{ matrix.os }}

      # `stream_events.rs` 声明了 required-features = ["futures"]，不带该特征时
      # cargo 会静默跳过它——`--all-targets` 也不编。这里显式打开，用包名限定
      # 是为了让 --workspace 里不含该特征的成员（steamworks-sys）不报错。
      - run: cargo check --locked --workspace --all-targets --features steamworks/futures

  # 静态质检：unsafe 边界、死依赖、依赖漏洞。
  # 工具必须装上（装不上就判红），但**发现内容**只作提示、不挡 PR。
  quality-extra:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        toolchain: [nightly]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libudev-dev libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Install advisory tools
        run: |
          # 装工具本身失败要让作业判红。以前这里只有 `|| true`，而 runner 上根本没装
          # 这三个子命令，于是三条"质检"从第一次运行起就是空转的绿：
          # `error: no such command: geiger` 被吞掉了。
          cargo install cargo-udeps cargo-geiger cargo-audit --locked

      # 三条都是"发现内容不挡 PR"，但**必须给出判定**。原先的 `|| true`
      # 让 runner 上 `no such command` 这种"根本没跑"也被吞成绿（实测发生过）。
      # 现在每一步都要求拿到结构性结论：udeps 要读到依赖图、geiger 与 audit 要产出可解析的 JSON。
      - name: udeps (dead dependencies)
        run: |
          set -uo pipefail
          out=$(cargo +nightly udeps --all-targets --all-features 2>&1) || true
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "Loading depinfo" || { echo "::error::udeps 没有读到依赖图，判定为空"; exit 1; }
          printf '%s\n' "$out" | grep -qiE "All deps seem to have been used|unused" || { echo "::error::udeps 没有结论行"; exit 1; }

      - name: geiger (unsafe code counter)
        run: |
          set -uo pipefail
          # 解释器不在就必须判红：早先一个本地版检查用 `2>/dev/null` 把
          # "python3: command not found" 吞掉，于是 JSON 分支静默失效、
          # 退化成 grep 兜底 —— 门看着在跑，其实没判。
          command -v python3 >/dev/null || { echo "::error::python3 缺失，geiger 判定无法核验"; exit 1; }
          cargo geiger --all-features --output-format Json > geiger.json || true
          # 判定形式两种都认（Json 是主路，表格是兜底），但**必须有内容**：
          # 空文件、只有进度噪音、或工具没跑，都判红。
          if python3 -c 'import json,sys;sys.exit(0 if json.load(open("geiger.json")) else 1)'; then
            echo "geiger verdict: 可解析的非空 JSON 报告"
            wc -c geiger.json
          elif grep -qi "unsafe" geiger.json; then
            echo "geiger verdict: 表格形式报告"
            grep -ai "steamworks" geiger.json | tail -4
          else
            echo "::error::geiger 没有给出判定（报告为空或不可解析）"
            exit 1
          fi

      - name: audit (vulnerability scan)
        run: |
          set -uo pipefail
          command -v python3 >/dev/null || { echo "::error::python3 缺失，audit 判定无法核验"; exit 1; }
          # 这道门现在是**判红**的：`--deny warnings` 让任何 advisory 都算失败，
          # 唯一例外是下面逐条登记过的 6 条——它们全部来自 examples/* 的 macroquad
          # 依赖链（`cargo tree -p steamworks -e normal,build -i <包>` 实测只回到
          # chat-example 等示例成员，或在本平台图上根本不可达），不在发布的 .crate 里。
          # 新增依赖若引入新 advisory，这里会红，而不是继续"提示"。
          cargo audit --json --deny warnings \
            --ignore RUSTSEC-2021-0019 \
            --ignore RUSTSEC-2020-0097 \
            --ignore RUSTSEC-2025-0051 \
            --ignore RUSTSEC-2025-0035 \
            --ignore RUSTSEC-2022-0056 \
            --ignore RUSTSEC-2026-0192 > audit.json
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::cargo audit 判红（退出码 $code）：出现了未登记的新 advisory"
            python3 -c 'import json;d=json.load(open("audit.json"));print(json.dumps({"vulnerabilities":d["vulnerabilities"]["count"],"warnings":{k:len(v) for k,v in d["warnings"].items()}},ensure_ascii=False))' || true
            exit 1
          fi
          python3 - <<'PY'
          import json, sys, datetime
          report = json.load(open("audit.json"))
          db = report["database"]
          count = db["advisory-count"]
          updated = datetime.datetime.fromisoformat(db["last-updated"].replace("Z", "+00:00"))
          age_days = (datetime.datetime.now(updated.tzinfo) - updated).days
          print(f"advisory DB: {count} entries, last updated {updated:%Y-%m-%d} ({age_days}d ago)")
          print(f"unignored vulnerabilities: {report['vulnerabilities']['count']}, "
                f"warnings: {sum(len(v) for v in report['warnings'].values())}")
          # 判定成立的前提：库是齐的、也是新的。空库或陈旧库都不算"扫过了"。
          if count < 500:
              print("::error::advisory 数据库条目异常少，判定不可信"); sys.exit(1)
          if age_days > 30:
              print("::error::advisory 数据库超过 30 天没更新，判定不可信"); sys.exit(1)
          PY
