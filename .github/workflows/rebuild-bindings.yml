name: Rebuild bindings

# 用 bindgen 从 `steamworks-sys/lib/steam` 的头文件重生成四平台绑定。
#
# 这里刻意**不再**在 push 时自动跑并自动提交：原先的写法是
# `on: push: paths: [steamworks-sys]` + 一个 push 作业直接把
# `Update bindings` 提交回触发分支，用的还是 `ad-m/github-push-action@master`
# （浮动 tag 的第三方推送动作）和未声明 permissions 时的默认写权限。
# 那等于"任何碰到 sys 目录的提交都可能让机器人往 master 写生成代码"，
# 而生成结果由四台 runner 的 bindgen/libclang 版本决定，不由我控制。
#
# 现在的口径：默认只**报告漂移**（产出 bindings.diff 附件），要落盘就得是
# 人明确勾选 `commit_bindings`，且提交作业单独只拿 `contents: write`。
on:
  workflow_dispatch:
    inputs:
      commit_bindings:
        description: 把重生成的绑定提交回当前分支（默认只生成 diff 附件）
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: rebuild-bindings-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_file: windows_bindings.rs
          - os: ubuntu-latest
            target_file: linux_bindings.rs
          - os: macos-latest
            target_file: macos_bindings.rs
          - os: ubuntu-22.04-arm
            target_file: linuxarm_bindings.rs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # actions-rs/toolchain@v1 已弃用（上游仓库撤下后会在解析阶段失败），
      # 换成和 CI 主链一致的 dtolnay。
      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang and system deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libclang-dev clang libasound2-dev libudev-dev
        if: runner.os == 'linux'

      - uses: Swatinem/rust-cache@v2

      - name: Regenerate bindings
        # rebuild-bindings 特征会拉起 bindgen；STEAM_SDK_LOCATION 指向仓内随包的 SDK。
        run: cargo build --features "rebuild-bindings"
        working-directory: steamworks-sys

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.os }}
          path: steamworks-sys/src/${{ matrix.target_file }}

  compare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.drift.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang and system deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libclang-dev clang libasound2-dev libudev-dev

      - name: Collect regenerated bindings
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: steamworks-sys/src/
          merge-multiple: true

      # 生成代码要求格式稳定，否则漂移 diff 里混进 rustfmt 噪音。
      # 直接点名文件：`rustfmt.toml` 里 `ignore = ["steamworks-sys"]` 需要 nightly
      # 才生效，走 `cargo fmt -p` 在 stable 上行为不可预期。
      - name: Format regenerated bindings
        run: rustfmt --edition 2021 steamworks-sys/src/*_bindings.rs

      - id: drift
        name: Does the tree differ?
        # 必须分两类报，否则这扇门会被环境噪音糊住：实测一次重生成产生 12 KB diff，
        # 内容全是 macOS 的 libc++/SDK 版本宏（_LIBCPP_*、__MAC_26_*）和 Windows 的
        # ucrt 常量（_STATIC_INLINE_UCRT_FUNCTIONS 1->0），**Steam API 面 0 行**。
        # 只有 api_changed=true 才意味着绑定的 API 面真的变了。判定本身在
        # `scripts/ci/bindings_drift.py`：四份夹具的正反例由 `canaries.py` 钉住，因为它原先是
        # 内联 shell，谁都复算不了它到底数到了什么。
        run: |
          set -uo pipefail
          summary="$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- steamworks-sys/src; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "api_changed=false" >> "$GITHUB_OUTPUT"
            printf '### 绑定重生成：无漂移\n' >> "$summary"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          read -r added deleted <<<"$(git diff --numstat -- steamworks-sys/src | awk '{a+=$1; d+=$2} END{print a" "d}')"
          git diff -U0 -- steamworks-sys/src > /tmp/bindings.diff
          # stdout is the two `$GITHUB_OUTPUT` keys, stderr is the human line the summary quotes.
          git diff -U0 -- steamworks-sys/src \
            | python3 scripts/ci/bindings_drift.py >> "$GITHUB_OUTPUT" 2>/tmp/drift.txt
          {
            printf '### 绑定重生成：有漂移\n\n'
            printf -- '- 行数：+%s / -%s\n' "$added" "$deleted"
            sed 's/^/- /' /tmp/drift.txt
            printf -- '- 判定口径与被数到的行见上；完整 diff 见附件 `bindings-drift`\n'
          } >> "$summary"
          sed 's/^/drift: /' /tmp/drift.txt

      - uses: actions/upload-artifact@v4
        if: steps.drift.outputs.changed == 'true'
        with:
          name: bindings-drift
          path: /tmp/bindings.diff

      - name: Explain
        if: always()
        run: |
          echo "默认行为：只报告漂移并附 diff。要落盘请勾 commit_bindings；"
          echo "之后仍需 CI 的 quality 矩阵在三平台编译这份生成代码。"

  # 写权限只给这一个作业，而且必须是人在 workflow_dispatch 上明确勾选。
  # 之前把 `contents: ${{ inputs... }}` 写在 permissions 里是错的：`inputs`
  # 上下文只在 workflow_dispatch 存在，其他事件下整条 workflow 校验失败，
  # 表现为"跑了但一个 job 都没有"的红。
  apply:
    needs: compare
    if: github.event_name == 'workflow_dispatch' && inputs.commit_bindings == true && needs.compare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang and system deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libclang-dev clang libasound2-dev libudev-dev

      - name: Collect regenerated bindings
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: steamworks-sys/src/
          merge-multiple: true

      - name: Commit regenerated bindings
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rustfmt --edition 2021 steamworks-sys/src/*_bindings.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add steamworks-sys/src
          git diff --cached --quiet && { echo "无改动可提交"; exit 0; }
          git commit -m "chore: regenerate bindings from the bundled SDK headers"
          git push origin "HEAD:${BRANCH}"
